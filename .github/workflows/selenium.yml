name: Selenium E2E CI

on:
  push:
    branches: [main, develop]
    paths:
      - "services/backend/**"
      - "services/frontend/**"
      - "services/selenium/**"
      - ".github/workflows/selenium.yml"
  pull_request:
    paths:
      - "services/backend/**"
      - "services/frontend/**"
      - "services/selenium/**"
      - ".github/workflows/selenium.yml"
  workflow_dispatch:

concurrency:
  group: selenium-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  JWT_SECRET_KEY: ci-e2e-secret-not-for-production
  DATABASE_URL: sqlite:///./e2e.db
  BASE_URL: http://localhost:5173
  AUTH_URL: http://localhost:8000
  CHROME_HEADLESS: "1"
  SELENIUM_IMPLICIT_WAIT: "1"
  SELENIUM_WAIT_DEFAULT: "10"
  SELENIUM_WAIT_PRESENCE: "6"

jobs:
  e2e:
    name: Selenium E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            services/backend/requirements.txt
            services/selenium/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Export ChromeDriver path
        run: echo "CHROMEDRIVER_PATH=$(which chromedriver)" >> "$GITHUB_ENV"

      - name: Install backend dependencies
        working-directory: services/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: services/frontend
        run: npm ci

      - name: Install Selenium dependencies
        working-directory: services/selenium
        run: pip install -r requirements.txt

      - name: Run backend migrations
        working-directory: services/backend
        run: alembic upgrade head

      - name: Build frontend
        working-directory: services/frontend
        run: npm run build

      - name: Start backend
        working-directory: services/backend
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
          echo "BACKEND_PID=$!" >> "$GITHUB_ENV"

      - name: Start frontend with Vite proxy
        working-directory: services/frontend
        run: |
          nohup npm run dev -- --host 0.0.0.0 --port 5173 > frontend.log 2>&1 &
          echo "FRONTEND_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become ready in time"
          cat services/backend/backend.log || true
          exit 1

      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5173; then
              exit 0
            fi
            sleep 2
          done
          echo "Frontend did not become ready in time"
          cat services/frontend/frontend.log || true
          exit 1

      - name: Run Selenium E2E tests
        working-directory: services/selenium
        run: pytest -v --tb=short --junitxml=selenium-results.xml

      - name: Upload Selenium screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-screenshots
          path: services/selenium/screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload E2E logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-e2e-artifacts
          path: |
            services/selenium/selenium-results.xml
            services/backend/backend.log
            services/frontend/frontend.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop services
        if: always()
        run: |
          kill "${BACKEND_PID:-}" 2>/dev/null || true
          kill "${FRONTEND_PID:-}" 2>/dev/null || true
          rm -f services/backend/e2e.db