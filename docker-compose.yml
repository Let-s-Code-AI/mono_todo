services:
  backend:
    build: ./services/backend
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Ustaw JWT_SECRET_KEY w pliku .env}
      DATABASE_URL: sqlite:////data/todo.db
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - backend-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build: ./services/frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
